; SparkFun Thing Plus ESP32-S3 (WRL-24408)
; No board definition in PlatformIO, so this uses the generic devkitc-1 with
; SparkFun's settings (USB CDC on boot, PSRAM, 4MB flash).

[env:thing_plus_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; USB CDC on boot, hardware CDC/JTAG
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

board_build.partitions = default.csv
board_upload.flash_size = 4MB

; Host-side unit tests for the pure logic
[env:native]
platform = native
test_framework = unity
