; PlatformIO project for the SparkFun Thing Plus ESP32-S3 (WRL-24408)
;
; PlatformIO's espressif32 platform has no dedicated board definition for this
; board (see docs/architecture.md), so this env starts from the generic
; esp32-s3-devkitc-1 definition and overrides the parts SparkFun's own Arduino
; guide calls out (USB CDC on boot, PSRAM). Flash/PSRAM sizing here is our
; best-known value from SparkFun's docs (4MB flash / 2MB PSRAM) and must be
; confirmed against `esptool.py flash_id` during bring-up — see architecture
; doc TODOs.

[env:thing_plus_esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; USB CDC on Boot: Enabled, USB Mode: Hardware CDC and JTAG
; (mirrors the Arduino IDE settings SparkFun's guide specifies)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

board_build.partitions = default.csv
board_upload.flash_size = 4MB
